# =============================================================================
# Reusable: the security gate. Same checks on every project.
# =============================================================================
# Split from python-backend.yml on purpose: these checks want their own
# permissions and they should keep running on a schedule even when nobody
# pushes — a dependency becomes vulnerable on a day you were not committing.
#
# Three of the four checks below need GitHub Advanced Security, which a private
# repository on the Free plan does not have: code scanning is off, so CodeQL
# cannot run, SARIF cannot be uploaded, and dependency-review has no API to ask.
# They are therefore opt-in rather than on by default — turn them on for a
# public repository, or once a plan carries them. What is left works on any
# plan and is not a token gesture: secrets over full history, and a filesystem
# scan that fails the build rather than filing a report nobody can read.
#
#   uses: CtrlAltDevelop/ci-workflows/.github/workflows/security.yml@v1
#
on:
  workflow_call:
    inputs:
      codeql:
        description: "Run CodeQL. Needs code scanning, so public or GHAS only."
        type: boolean
        default: false
      languages:
        description: 'CodeQL languages, JSON array, e.g. ["python"]'
        type: string
        default: '["python"]'
      dependency-review:
        description: "Review new dependencies on a PR. Public or GHAS only."
        type: boolean
        default: false
      sarif:
        description: |
          Upload findings to the security tab instead of failing the job on
          them. Needs code scanning, so public or GHAS only.
        type: boolean
        default: false
      severity:
        description: "Trivy severities that count"
        type: string
        default: "CRITICAL,HIGH"

permissions: {}

jobs:
  # Secrets first. A leaked key is the one finding that cannot be fixed by a
  # commit — it has to be rotated, so it should be the loudest.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads history, not just the tip: a key that was committed
          # and then deleted is still in the pack file and still leaked.
          fetch-depth: 0
          persist-credentials: false
      # v3 only moves the runtime to Node 24. Node 20 leaves the hosted
      # runners entirely on 16 September 2026, after which v2 stops running
      # whatever opt-out flag is set.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: inputs.codeql
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          # `languages`, not `language`. The singular is silently ignored, and
          # CodeQL then auto-detects everything in the tree — including the
          # Swift under a Flutter app's macos/ directory, which fails on a
          # Linux runner for a reason that has nothing to do with your code.
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # Filesystem scan: dependency manifests and IaC in one pass.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Static on purpose: `permissions` is resolved before inputs exist, so it
      # cannot be narrowed by one. Unused when sarif is off.
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Without a security tab to file into, the finding has to stop the build
      # or it may as well not have been made.
      - uses: aquasecurity/trivy-action@v0.36.0
        if: ${{ !inputs.sarif }}
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: ${{ inputs.severity }}
          ignore-unfixed: true

      - uses: aquasecurity/trivy-action@v0.36.0
        if: inputs.sarif
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: inputs.sarif && always()
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  # Only on pull requests: blocks a *new* vulnerable or badly-licensed
  # dependency from entering, without failing the build over the backlog of
  # ones already there.
  dependency-review:
    name: Dependency review
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
