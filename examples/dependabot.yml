# Actions first: an unpinned or abandoned action is the most direct route into a
# pipeline that can execute code on the staging server.
#
# Every update opens against `develop`, not the default branch: `main` is
# dormant until there is a production server, and a pull request there would
# never be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /sources/backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /sources/dashboard
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: /sources/landing
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /sources/dashboard/android
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /sources/backend
    target-branch: develop
    schedule:
      interval: weekly
