# Actions first: an unpinned or abandoned action is the most direct route into
# a pipeline that can execute code in your repository.
#
# Copy this into a project's .github/dependabot.yml and delete whichever
# ecosystems you don't have (e.g. drop `pub`/`gradle` for a backend-only repo).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
