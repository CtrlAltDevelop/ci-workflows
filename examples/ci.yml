# =============================================================================
# CI — the gate in front of your default branch.
# =============================================================================
# Copy this into a project's .github/workflows/ci.yml and adjust the jobs you
# need. Delete the ones you don't (e.g. drop `flutter` for a backend-only repo,
# or `backend` for a Flutter-only repo).
#
# Runs on cloud runners only: no secret, no server, no self-hosted access.
# The heavy lifting lives in CtrlAltDevelop/ci-workflows so multiple projects
# run the same checks without copies drifting apart.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend:
    name: Backend
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-backend.yml@v1
    with:
      working-directory: backend
      python-version: "3.14"
      mypy: true

  security:
    name: Security
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/security.yml@v1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      languages: '["python"]'

  app:
    name: App
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/flutter-android.yml@v1
    with:
      working-directory: app
      flutter-version: "3.47.0"
      # Debug-signed. This job is reachable from a pull request, so it must
      # never be handed the upload key. See flutter-android.yml for signing.
      sign: false
      # Any codegen your app needs before `flutter analyze`, one command per
      # line. Remove if you have none.
      codegen: |
        dart run build_runner build --delete-conflicting-outputs
